services:
  nutrition-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrition-rag
    ports:
      - "${PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-agy}
      - AGY_BIN=/root/.local/bin/agy
      - AGY_MODEL=${AGY_MODEL:-gemini-3.8-flash-high}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - AUTO_WATCH_DOCUMENTS=true
      - WATCH_INTERVAL_SECONDS=5
    volumes:
      - ./data:/app/data
      - /home/ubuntu/.local/bin:/root/.local/bin:ro
      - /home/ubuntu/.gemini:/root/.gemini
    restart: unless-stopped
